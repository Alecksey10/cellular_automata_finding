name: pages

# Галерея собирается из исходников и публикуется артефактом:
# готовый HTML в репозитории не хранится.

on:
  push:
    branches: [main]
    paths:
      - "try_3_code/sweep/**"
      - "try_3_code/runs/**"
      - "try_3_code/pages/**"
      - "try_3_code/requirements.txt"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: try_3_code/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Зависимости
        run: pip install -r try_3_code/requirements.txt

      - name: Сборка галереи
        run: try_3_code/pages/build.sh "$RUNNER_TEMP/site"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
